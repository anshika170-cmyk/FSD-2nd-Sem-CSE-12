<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>
    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }
        h1{
            color: #333;
        }
        button{
            padding: 10px 20px;
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: darkblue;
        }
    </style>
</head>

<body>

<h1>Welcome to My Webpage</h1>
<p>Click the button to see a message.</p>

<button onclick="showMessage()">Click Me</button>

<p id="demo"></p>

<script>
function showMessage(){
    document.getElementById("demo").innerHTML = "Hello! Your webpage is working.";
}
</script>

</body>
</html>
